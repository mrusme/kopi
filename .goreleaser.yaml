version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .Date }}
    targets:
      - linux_amd64
      - linux_arm64
      - linux_arm_6
      - linux_arm_7
      - linux_386
      - linux_riscv64
      - linux_ppc64le
      - linux_s390x
      - linux_loong64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_386
      - windows_arm64
      - freebsd_amd64
      - freebsd_arm64
      - freebsd_arm_6
      - freebsd_arm_7
      - freebsd_386
      - netbsd_amd64
      - openbsd_amd64
      - openbsd_arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"

changelog:
  use: github
  format: "{{ .SHA }}: {{ .Message }} (@{{ .AuthorUsername }})"
  sort: asc
  abbrev: -1
